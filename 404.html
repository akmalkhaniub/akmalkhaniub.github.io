<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Akmal Khan</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    .nf-wrap { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .nf-code { font-family: var(--font-header); font-size: 6rem; font-weight: 800; background: var(--gradient-main); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; }
    .nf-wrap h1 { font-size: 1.6rem; margin: 1rem 0 0.5rem; color: var(--text-primary); }
    .nf-wrap p { color: var(--text-secondary); margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="nf-wrap">
    <div class="nf-code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <div>
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/blog/" class="btn btn-secondary">Visit the Blog</a>
    </div>
  </div>
</body>
</html>
